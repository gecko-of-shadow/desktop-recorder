<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --panel-bg: #f2f2f2;
    --panel-fg: #111111;
    --panel-border: #888888;
    --base-font: 16px;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    height: 100%;
  }
  /* The viewport clips the text. The text moves with a transform. */
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--bg);
  }
  #text {
    position: absolute;
    left: 0;
    top: 0;
    min-width: 100%;
    /* One viewport height of padding at the top and at the bottom. */
    padding: 100vh 0;
    box-sizing: content-box;
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
    font-size: var(--base-font);
    line-height: 1.4;
    will-change: transform;
  }
  #text .ln {
    white-space: pre;
    padding: 0 16px;
    color: var(--fg);
  }
  /* Colored lines L241 to L270 (SHARED SPEC item 5). */
  #text .c0 { color: #d00000; } /* red */
  #text .c1 { color: #0033dd; } /* blue */
  #text .c2 { color: #008a00; } /* green */
  #text .c3 { color: #c000c0; } /* magenta */
  #text .c4 { color: #e06000; } /* orange */
  #text .c5 { color: #008080; } /* teal */
  /* The Zalgo line L290 has stacked marks. Extra space keeps the marks off L289 and L291. */
  #text .ln[data-tag="L290"] { padding-top: 1em; padding-bottom: 1em; }

  #panel {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    background: var(--panel-bg);
    color: var(--panel-fg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px 12px;
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    max-width: calc(100vw - 48px);
  }
  #panel label { display: block; margin: 2px 0; }
  #panel select { margin-left: 6px; }
  #panel .buttons { margin-top: 8px; display: flex; gap: 6px; }
  #panel button { padding: 3px 10px; }
  #panel .info { margin-top: 6px; color: #444; font-size: 12px; }
  body.running #panel, body.counting #panel { display: none; }
  body.running, body.counting { cursor: none; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: system-ui, "Segoe UI", sans-serif;
    color: var(--fg);
    pointer-events: none;
  }
  #countdown { font-size: 160px; font-weight: 700; }
  #endbox .big { font-size: 96px; font-weight: 700; }
  #endbox .small { font-size: 22px; margin-top: 8px; }
  body.counting #countdown { display: flex; }
  body.ended #endbox { display: flex; }
</style>
</head>

<script>
(function () {
  "use strict";

  var SPEEDS = [200, 500, 1000, 2000, 3000];
  var FONTS = [100, 125, 150];
  var DELAYS = [0, 3, 5, 10];
  var BASE_FONT_PX = 16;
  var COLOR_FIRST = 241;
  var COLOR_LAST = 270;
  var COLOR_COUNT = 6;

  var body = document.body;
  var textEl = document.getElementById("text");
  var speedEl = document.getElementById("speed");
  var fontEl = document.getElementById("font");
  var delayEl = document.getElementById("delay");
  var infoEl = document.getElementById("info");
  var countdownEl = document.getElementById("countdown");
  var endStatsEl = document.getElementById("endstats");

  // State: "idle", "counting", "running" or "ended".
  var state = "idle";
  var rafId = 0;
  var timerId = 0;
  var t0 = 0;          // performance.now() at scroll start, in ms
  var distance = 0;    // total scroll distance, in CSS px
  var frames = 0;      // number of animation frames drawn while scrolling
  var speed = 1000;    // px/s, fixed at start

  // ---- Build one element for each line of the source text. ----
  function loadLines() {
    var raw = document.getElementById("source").textContent;
    raw = raw.replace(/\r\n?/g, "\n");
    var lines = raw.split("\n");
    // Remove the empty lines that the script tags add at the start and the end.
    while (lines.length && lines[0] === "") lines.shift();
    while (lines.length && lines[lines.length - 1] === "") lines.pop();

    var frag = document.createDocumentFragment();
    lines.forEach(function (line) {
      var div = document.createElement("div");
      div.className = "ln";
      div.textContent = line;
      var m = /^L(\d{3}) /.exec(line);
      if (m) {
        var n = parseInt(m[1], 10);
        div.setAttribute("data-tag", "L" + m[1]);
        if (n >= COLOR_FIRST && n <= COLOR_LAST) {
          div.classList.add("c" + ((n - COLOR_FIRST) % COLOR_COUNT));
        }
      }
      frag.appendChild(div);
    });
    textEl.appendChild(frag);
    return lines.length;
  }

  // ---- URL hash: read and write the settings. ----
  function pick(value, allowed, fallback) {
    // Number(null) and Number("") give 0. Do not accept them as a value.
    if (value === null || value === "") return fallback;
    var n = Number(value);
    return allowed.indexOf(n) >= 0 ? n : fallback;
  }

  function readHash() {
    var params = new URLSearchParams(location.hash.replace(/^#/, ""));
    speedEl.value = String(pick(params.get("speed"), SPEEDS, Number(speedEl.value)));
    fontEl.value = String(pick(params.get("font"), FONTS, Number(fontEl.value)));
    delayEl.value = String(pick(params.get("delay"), DELAYS, Number(delayEl.value)));
  }

  function writeHash() {
    var h = "#speed=" + speedEl.value + "&font=" + fontEl.value + "&delay=" + delayEl.value;
    if (location.hash !== h) history.replaceState(null, "", h);
  }

  function applyFont() {
    var px = BASE_FONT_PX * Number(fontEl.value) / 100;
    document.documentElement.style.setProperty("--base-font", px + "px");
  }

  // ---- Position. Round to whole device pixels to keep the text sharp. ----
  function setOffset(px) {
    var dpr = window.devicePixelRatio || 1;
    var y = Math.round(px * dpr) / dpr;
    textEl.style.transform = "translateY(" + (-y) + "px)";
  }

  function setState(next) {
    body.classList.remove("idle", "counting", "running", "ended");
    body.classList.add(next);
    state = next;
  }

  // ---- Scroll loop. The position comes from elapsed real time only. ----
  function tick(now) {
    var pos = (now - t0) / 1000 * speed;
    frames++;
    if (pos >= distance) {
      setOffset(distance);
      finish(now);
      return;
    }
    setOffset(pos);
    rafId = requestAnimationFrame(tick);
  }

  function beginScroll() {
    setState("running");
    // Total distance: the first line starts at the bottom edge,
    // and the last line leaves at the top edge.
    distance = textEl.offsetHeight - window.innerHeight;
    frames = 0;
    rafId = requestAnimationFrame(function (now) {
      t0 = now;
      setOffset(0);
      rafId = requestAnimationFrame(tick);
    });
  }

  function finish(now) {
    var seconds = (now - t0) / 1000;
    var avg = seconds > 0 ? distance / seconds : 0;
    var fps = seconds > 0 ? frames / seconds : 0;
    endStatsEl.textContent =
      "Average speed " + avg.toFixed(1) + " px/s (target " + speed + " px/s). " +
      "Distance " + distance + " px in " + seconds.toFixed(3) + " s. " +
      "Browser frames " + frames + " (" + fps.toFixed(1) + " per s). Font " + fontEl.value + "%.";
    setState("ended");
  }

  function start() {
    if (state === "counting" || state === "running") return;
    stopTimers();
    applyFont();
    writeHash();
    setOffset(0);
    speed = Number(speedEl.value);
    var delay = Number(delayEl.value);
    if (delay <= 0) {
      beginScroll();
      return;
    }
    setState("counting");
    var left = delay;
    countdownEl.textContent = String(left);
    timerId = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(timerId);
        timerId = 0;
        countdownEl.textContent = "";
        beginScroll();
      } else {
        countdownEl.textContent = String(left);
      }
    }, 1000);
  }

  function stopTimers() {
    if (rafId) cancelAnimationFrame(rafId);
    if (timerId) clearInterval(timerId);
    rafId = 0;
    timerId = 0;
  }

  function reset() {
    stopTimers();
    setOffset(0);
    countdownEl.textContent = "";
    setState("idle");
  }

  // ---- Events. ----
  document.getElementById("start").addEventListener("click", function (e) {
    e.currentTarget.blur();
    start();
  });
  document.getElementById("reset").addEventListener("click", function (e) {
    e.currentTarget.blur();
    reset();
  });
  [speedEl, fontEl, delayEl].forEach(function (el) {
    el.addEventListener("change", function () {
      applyFont();
      writeHash();
      el.blur();
    });
  });
  window.addEventListener("hashchange", function () {
    if (state === "idle" || state === "ended") {
      readHash();
      applyFont();
    }
    // Show the settings that are in use. This also removes values that are not valid.
    writeHash();
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "SELECT") return;
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (state === "counting" || state === "running") reset();
      else start();
    } else if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
    }
  });

  // ---- Start-up. ----
  var count = loadLines();
  readHash();
  applyFont();
  writeHash();
  setState("idle");
  infoEl.textContent = count + " lines loaded.";
})();
</script>
