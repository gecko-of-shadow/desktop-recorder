name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: '"%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:DesktopRecorder.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll RecorderCore.cs RecordingSession.cs DesktopRecorder.cs'
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopRecorder
          path: DesktopRecorder.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 24.04 packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mono-devel libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            ffmpeg xvfb xdotool x11-utils
      - name: Test
        run: xvfb-run -a ./run-tests.sh
